        :root {

        header {

            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;

            color: #000;
            padding: 10px 15px;
            text-align: center;
            font-weight: 600;

            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab {
            padding: 8px 16px;
            background: white;
            border-radius: 20px;
            white-space: nowrap;
            border: 1px solid #ddd;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: 0.3s;
        }
        .tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
            border-left: 5px solid var(--primary);
        }
        .card:hover { transform: translateY(-3px); }

        .bachan-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            position: relative;
        }
        .bachan-text::before {

            font-size: 3rem;
            color: rgba(46, 125, 50, 0.1);
            position: absolute;
            top: -20px;
            left: -10px;

        // --- 2. UI Logic: Rendering ---
        const bachanList = document.getElementById('bachan-list');
        const tabs = document.querySelectorAll('.tab');

        function renderBachan(filter = 'all') {
            bachanList.innerHTML = '';
            const filteredData = filter === 'all' 
                ? bachanData 
                : bachanData.filter(item => item.category === filter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="bachan-text">${item.text}</div>
                    <div class="meaning">
                        <span class="label text-primary">সরলার্থ:</span>
                        ${item.meaning}
                    </div>
                    <div class="logic">
                        <span class="label" style="color:var(--accent); margin-top:8px;">যুক্তি/ব্যাখ্যা:</span>
                        ${item.logic}
                    </div>
                    <button class="share-btn" onclick="shareBachan('${item.text}')">
                        <i class="fas fa-share-alt"></i> বন্ধুদের সাথে শেয়ার করুন
                    </button>
                `;
                bachanList.appendChild(card);
            });
        }

        function filterBachan(category) {
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            renderBachan(category);
        }

        async function shareBachan(text) {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'খনার বচন',
                        text: text + ' - অ্যাপটি ডাউনলোড করুন: https://khonar-bachan.app',
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Share canceled');
                }
            } else {
                alert('টেক্সট কপি করা হয়েছে: ' + text);
                navigator.clipboard.writeText(text);
            }
        }

        // Initial Render
        renderBachan();

        // --- 3. PWA Installation Logic ---
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'flex'; // Show banner
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBanner.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // --- 4. Notification Logic (Simulation) ---
        function requestNotification() {
            if (!("Notification" in window)) {
                alert("আপনার ব্রাউজার নোটিফিকেশন সাপোর্ট করে না।");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("ধন্যবাদ!", {
                        body: "এখন থেকে আপনি প্রতি ঘন্টায় একটি করে খনার বচন পাবেন।",
                        icon: "https://cdn-icons-png.flaticon.com/512/3025/3025642.png" // Leaf icon
                    });
                    startHourlyNotifications();
                }
            });
        }

        function startHourlyNotifications() {
            // Note: This interval works best when the app is open or in background on some desktops.
            // Real mobile background push requires a server.
            setInterval(() => {
                const randomBachan = bachanData[Math.floor(Math.random() * bachanData.length)];
                new Notification("খনার বচন মনে আছে তো?", {
                    body: randomBachan.text,
                    icon: "https://cdn-icons-png.flaticon.com/512/3025/3025642.png",
                    tag: "khona-hourly"
                });
            }, 3600000); // 1 Hour in ms
        }

        // --- 5. Register Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Fail', err));
            });
        }
    </script>
